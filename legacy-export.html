<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exportar PokéÁlbum local</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:#202b32;color:#f1f3ee;font:16px/1.5 system-ui,sans-serif}.panel{width:min(520px,100%);padding:1.25rem;border:1px solid #c89e50;border-radius:8px;background:#142725}h1{margin:0 0 .5rem;font-size:1.35rem}p{color:#d5ded7}.note{padding:.7rem;border-left:3px solid #d7ad4e;background:#ffffff0a;font-size:.9rem}button{min-height:44px;border:1px solid #e5ce8a;border-radius:4px;background:#d7ad4e;color:#261d0d;padding:.45rem .8rem;font:inherit;font-weight:700}#status{min-height:1.5em;color:#efdfad}
</style>
</head>
<body>
<main class="panel">
  <h1>Exportar colección local</h1>
  <p>Esta página lee el guardado local de PokéÁlbum en este mismo origen.</p>
  <p class="note">El archivo incluye únicamente estampas y espacios del álbum. No exporta monedas, contraseñas, sesiones ni recompensas.</p>
  <button id="exportButton" type="button">Descargar colección</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
'use strict';
const status=document.querySelector('#status');
document.querySelector('#exportButton').addEventListener('click',()=>{
  try{
    const saved=JSON.parse(localStorage.getItem('pokealbum-v2')||'null');
    if(!saved){status.textContent='No se encontró un guardado local en este origen.';return}
    const payload={owned:saved.owned||{},shinyOwned:saved.shinyOwned||{},stickers:saved.stickers||{},shinyStickers:saved.shinyStickers||{}};
    const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download='pokealbum-collection.json';link.click();URL.revokeObjectURL(url);
    status.textContent='Colección exportada. Importa el archivo desde tu cuenta autenticada.';
  }catch{status.textContent='No se pudo leer el guardado local.'}
});
</script>
</body>
</html>
